<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Складской учёт | Инвентаризация и API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 font-sans">

<div id="authScreen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <i class="fas fa-warehouse text-5xl text-blue-600"></i>
            <h2 class="text-2xl font-bold mt-2">Складской учёт</h2>
            <p class="text-gray-500">Авторизация в системе</p>
        </div>
        <div id="loginForm">
            <input type="text" id="loginUsername" placeholder="Логин" class="w-full p-2 border rounded mb-3">
            <input type="password" id="loginPassword" placeholder="Пароль" class="w-full p-2 border rounded mb-3">
            <button id="doLoginBtn" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Войти</button>
        </div>
    </div>
</div>

<div id="mainApp" class="max-w-7xl mx-auto px-4 py-6 hidden">
    <div class="flex justify-between items-center mb-4 flex-wrap gap-3">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800"><i class="fas fa-warehouse text-blue-600 mr-2"></i>Складской учёт</h1>
            <p class="text-slate-500 text-sm">Приход, расход, инвентаризация, отчёты через API</p>
        </div>
        <div class="flex items-center gap-3">
            <div class="bg-white px-3 py-1 rounded-full shadow text-sm">
                <i class="fas fa-user-circle mr-1"></i> <span id="currentUserDisplay"></span>
                <span class="ml-2 px-2 py-0.5 bg-gray-200 rounded-full text-xs" id="roleDisplay"></span>
            </div>
            <button id="logoutBtn" class="bg-red-100 text-red-700 px-3 py-1 rounded-lg text-sm"><i class="fas fa-sign-out-alt"></i> Выйти</button>
        </div>
    </div>

    <div id="tabsContainer" class="flex flex-wrap gap-2 border-b border-gray-200 pb-3 mb-6"></div>

    <div id="itemsTab" class="tab-content hidden"></div>
    <div id="receiptTab" class="tab-content hidden"></div>
    <div id="issueTab" class="tab-content hidden"></div>
    <div id="stockTab" class="tab-content hidden"></div>
    <div id="inventoryTab" class="tab-content hidden"></div>
    <div id="reportsTab" class="tab-content hidden"></div>
    <div id="adminTab" class="tab-content hidden"></div>
</div>

<div id="movementModal" class="fixed inset-0 flex items-center justify-center z-50 hidden modal-backdrop">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 relative">
        <h3 id="modalTitle" class="text-xl font-bold mb-4">Добавить операцию</h3>
        <select id="modalItemCode" class="w-full border rounded p-2 mb-3"><option value="">Выберите товар</option></select>
        <input type="number" id="modalQty" placeholder="Количество" class="w-full border rounded p-2 mb-3" step="1" min="1">
        <input type="date" id="modalDate" class="w-full border rounded p-2 mb-4">
        <div class="flex justify-end gap-2">
            <button id="modalCancelBtn" class="px-4 py-2 bg-gray-300 rounded">Отмена</button>
            <button id="modalConfirmBtn" class="px-4 py-2 bg-blue-600 text-white rounded">Добавить</button>
        </div>
    </div>
</div>

<div id="itemModal" class="fixed inset-0 flex items-center justify-center z-50 hidden modal-backdrop">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 relative">
        <h3 class="text-xl font-bold mb-4">Добавить товар</h3>
        <input type="text" id="itemCode" placeholder="Код товара" class="w-full border rounded p-2 mb-3">
        <input type="text" id="itemName" placeholder="Наименование" class="w-full border rounded p-2 mb-3">
        <select id="itemUom" class="w-full border rounded p-2 mb-4">
            <option value="шт">шт</option><option value="кг">кг</option><option value="м">м</option><option value="кор">кор</option><option value="л">л</option>
        </select>
        <div class="flex justify-end gap-2">
            <button id="itemModalCancelBtn" class="px-4 py-2 bg-gray-300 rounded">Отмена</button>
            <button id="itemModalConfirmBtn" class="px-4 py-2 bg-blue-600 text-white rounded">Добавить</button>
        </div>
    </div>
</div>

<div id="userModal" class="fixed inset-0 flex items-center justify-center z-50 hidden modal-backdrop">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 relative border border-slate-100">
        <div class="flex items-center gap-3 mb-4 border-b pb-3">
            <div class="p-2 bg-blue-50 text-blue-600 rounded-lg"><i class="fas fa-user-plus text-xl"></i></div>
            <h3 class="text-xl font-bold text-slate-800">Новый пользователь</h3>
        </div>
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">ФИО сотрудника</label>
                <input type="text" id="userFullname" placeholder="Иванов Иван Иванович" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Логин (Уникальный)</label>
                <input type="text" id="userUsername" placeholder="ivanov.i" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Пароль</label>
                <input type="password" id="userPassword" placeholder="••••••••" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Роль и уровень доступа</label>
                <select id="userRole" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                    <option value="storekeeper">Кладовщик (Только операции)</option>
                    <option value="manager">Менеджер склада (Полный склад + Инвентарь)</option>
                    <option value="analyst">Аналитик (Остатки + Отчеты)</option>
                    <option value="admin">Администратор (Полный доступ)</option>
                </select>
            </div>
        </div>
        <div class="flex justify-end gap-2 mt-5 border-t pt-3">
            <button id="userModalCancelBtn" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200 transition text-sm font-medium">Отмена</button>
            <button id="userModalConfirmBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition text-sm font-medium">Создать аккаунт</button>
        </div>
    </div>
</div>

<input type="file" id="nomenclatureCsvInput" accept=".csv" class="hidden">
<input type="file" id="inventoryCsvInput" accept=".csv" class="hidden">

<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
